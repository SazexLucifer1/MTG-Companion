@if (cards().length > 1) {
  <div class="partner-card-stack">
    <div class="partner-card-slot partner-card-back" (click)="swapToFront($event)" [attr.aria-label]="i18n.t('partnerCardImage.swapAria')">
      @if (backCard.imageUrl; as imageUrl) {
        <app-card-image [imageUrl]="imageUrl" [backImageUrl]="backCard.backImageUrl" [alt]="backCard.name" [compact]="compact()" />
      } @else {
        <div class="partner-card-placeholder">{{ backCard.name }}</div>
      }
    </div>
    <div class="partner-card-slot partner-card-front" (click)="onFrontClick($event)">
      @if (frontCard.imageUrl; as imageUrl) {
        <app-card-image [imageUrl]="imageUrl" [backImageUrl]="frontCard.backImageUrl" [alt]="frontCard.name" [compact]="compact()" />
      } @else {
        <div class="partner-card-placeholder">{{ frontCard.name }}</div>
      }
    </div>
  </div>
} @else {
  <div class="partner-card-slot partner-card-solo" (click)="onFrontClick($event)">
    @if (cards()[0].imageUrl; as imageUrl) {
      <app-card-image [imageUrl]="imageUrl" [backImageUrl]="cards()[0].backImageUrl" [alt]="cards()[0].name" [compact]="compact()" />
    } @else {
      <div class="partner-card-placeholder">{{ cards()[0].name }}</div>
    }
  </div>
}
