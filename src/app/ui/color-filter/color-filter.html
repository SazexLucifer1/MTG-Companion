<!-- Kein eigener "alle"-Zustand im Modell: keine Farbe gewählt IST "alle". Der Knopf setzt die
     Auswahl zurück und zeigt an, dass gerade nicht eingeschränkt wird. -->
<button type="button" [class.active]="value().length === 0" (click)="value.set([])">
  {{ i18n.t('deckView.colorAll') }}
</button>
@for (color of options(); track color) {
  <!-- Der Farbname steht nur noch im Tooltip und im aria-label: das Symbol IST der Name, und
       sechs ausgeschriebene Farben nebeneinander sprengen jede Filterzeile. -->
  <button
    type="button"
    class="symbol-only"
    [class.active]="isActive(color)"
    (click)="toggle(color)"
    [title]="label(color)"
    [attr.aria-label]="label(color)"
    [attr.aria-pressed]="isActive(color)"
  >
    <app-mana-symbol [symbol]="color" />
  </button>
}
