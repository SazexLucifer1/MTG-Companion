<!-- Ohne Einträge gar nichts rendern: das <ul> trägt den "Boden" als border-bottom, ein leeres
     Treppchen hinterließe sonst einen Strich über der Liste (sichtbar ab Seite 2 der Rangliste).

     <ul> statt <ol>: die Reihenfolge im DOM ist 2-1-3, eine automatische Nummerierung wäre damit
     falsch. Die Platzierung steht ohnehin sichtbar als Medaille und Zahl an jedem Platz. -->
@if (places().length > 0) {
  <ul class="podium" [class.avatar]="shape() === 'avatar'">
    @for (p of places(); track p.entry.key) {
      <li class="place" [class.first]="p.place === 1" [class.third]="p.place === 3">
        <button type="button" class="head" (click)="entrySelect.emit(p.entry)">
          <span class="medal">{{ p.medal }}</span>
          @if (shape() === 'avatar') {
            <span
              class="avatar-frame"
              [style.background-image]="p.entry.imageUrl ? 'url(' + p.entry.imageUrl + ')' : null"
            >
              @if (!p.entry.imageUrl) {
                <span class="frame-placeholder">👤</span>
              }
            </span>
          } @else {
            <span class="card-frame">
              @if (p.entry.imageUrl; as img) {
                <img [src]="img" [alt]="p.entry.name" loading="lazy" />
              } @else {
                <span class="frame-placeholder">🃏</span>
              }
            </span>
          }
          <span class="name">{{ p.entry.name }}</span>
          <span class="value">{{ p.entry.value }}</span>
          <span class="detail">{{ p.entry.detail }}</span>
        </button>
        <div class="step">{{ p.place }}</div>
      </li>
    }
  </ul>
}
