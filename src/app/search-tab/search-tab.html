<div class="chip-row search-mode-toggle">
  <button class="glass-chip" [class.active]="subView() === 'cards'" (click)="subView.set('cards')">
    🔍 {{ i18n.t('search.cardsTab') }}
  </button>
  <button class="glass-chip" [class.active]="subView() === 'commander'" (click)="subView.set('commander')">
    👑 {{ i18n.t('search.commanderTab') }}
  </button>
  <button class="glass-chip" [class.active]="subView() === 'precons'" (click)="subView.set('precons')">
    📦 {{ i18n.t('search.preconsTab') }}
  </button>
  <button class="glass-chip" [class.active]="subView() === 'decks'" (click)="subView.set('decks')">
    🗂️ {{ i18n.t('search.decksTab') }}
  </button>
</div>

@if (subView() === 'cards') {
  <app-public-card-search />
} @else if (subView() === 'commander') {
  <app-commander-recommendations />
} @else if (subView() === 'precons') {
  <app-precon-browser />
} @else {
  <app-public-deck-browser />
}
