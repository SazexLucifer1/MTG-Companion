@if (!failed()) {
  <img [src]="currentSrc()" [alt]="alt()" loading="lazy" (error)="onImageError()" />
} @else {
  <div class="card-image-fallback">{{ alt() }}</div>
}
@if (backImageUrl()) {
  <button
    type="button"
    class="card-image-flip-button"
    (click)="toggleFlip($event)"
    [attr.aria-label]="i18n.t('cardImage.flipAria')"
  >
    🔄
  </button>
}
